<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Intelligence</title>
  <style>
    :root {
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --border: #dbeafe;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    button {
      margin-top: 18px;
      padding: 10px 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      background: #f6f6f6;
      padding: 12px 14px;
      border-radius: 8px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    #result:empty { display: none; }

    table {
      width: 100%;
      margin-top: 0;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 600;
    }
    tbody tr:hover { background: #fafbfe; }
    tbody tr:last-child td { border-bottom: none; }

    .empty-row td {
      color: var(--muted);
      text-align: center;
      padding: 20px 8px;
    }

    .delete-btn {
      margin-top: 0;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .delete-btn:hover { background: var(--danger); color: #fff; }
    .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>🌤️ Weather Intelligence</h1>
  <p class="hint">Fetch weather alerts and forecasts from the National Weather Service API. Data is stored in Lakebase for vector search and analysis.</p>

  <div class="card">
    <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">Sync Weather Data</h2>
    <form id="weather-form">
      <label for="locations">Locations (comma-separated)</label>
      <input type="text" id="locations" name="locations" placeholder="Chicago, IL, Austin, TX, New York, NY" required>
      
      <label for="limit" style="margin-top: 16px;">Max alerts per location</label>
      <input type="text" id="limit" name="limit" value="50" placeholder="50">
      
      <button type="submit">Sync Weather Data</button>
    </form>

    <div id="result"></div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 16px; font-weight: 600; margin: 0;">Recent Weather Documents</h2>
      <button onclick="loadDocuments()" style="margin: 0; padding: 6px 12px; font-size: 13px;">Refresh</button>
    </div>
    
    <div style="margin-bottom: 12px;">
      <label for="filter-location" style="display: inline-block; margin-right: 12px;">Filter by location:</label>
      <input type="text" id="filter-location" placeholder="e.g., Chicago" style="width: auto; display: inline-block; padding: 6px 10px;">
      <select id="filter-type" style="padding: 6px 10px; margin-left: 8px; border: 1px solid var(--border); border-radius: 6px;">
        <option value="">All types</option>
        <option value="alert">Alerts</option>
        <option value="forecast">Forecasts</option>
      </select>
      <button onclick="loadDocuments()" style="margin-left: 8px; padding: 6px 12px; font-size: 13px;">Apply</button>
    </div>
    
    <div id="documents-list"></div>
  </div>

  <script>
    const form = document.getElementById("weather-form");
    const resultEl = document.getElementById("result");
    const documentsListEl = document.getElementById("documents-list");

    async function loadDocuments() {
      const location = document.getElementById("filter-location").value;
      const sourceType = document.getElementById("filter-type").value;
      
      const params = new URLSearchParams({ limit: "20" });
      if (location) params.append("location", location);
      if (sourceType) params.append("source_type", sourceType);
      
      try {
        const resp = await fetch("/weather/documents?" + params);
        const data = await resp.json();
        
        if (!resp.ok) {
          documentsListEl.innerHTML = `<p style="color: var(--muted); padding: 20px; text-align: center;">Error loading documents: ${data.error || resp.statusText}</p>`;
          return;
        }
        
        if (!data.length) {
          documentsListEl.innerHTML = `<p style="color: var(--muted); padding: 20px; text-align: center;">No weather documents found. Sync some data above to get started.</p>`;
          return;
        }
        
        let html = "";
        data.forEach((doc) => {
          const typeColor = doc.source_type === "alert" ? "#ef4444" : "#0ea5e9";
          const typeLabel = doc.source_type === "alert" ? "ALERT" : "FORECAST";
          const issuedAt = doc.issued_at ? new Date(doc.issued_at).toLocaleString() : "-";
          
          html += `
            <div style="border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                <div>
                  <span style="display: inline-block; background: ${typeColor}; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 8px;">${typeLabel}</span>
                  <span style="color: var(--muted); font-size: 13px;">${doc.location}</span>
                </div>
                <span style="color: var(--muted); font-size: 12px;">${issuedAt}</span>
              </div>
              <h3 style="font-size: 14px; font-weight: 600; margin: 8px 0; color: var(--text);">${doc.event || "Weather Update"}</h3>
              <p style="font-size: 14px; margin: 4px 0; color: var(--text);">${doc.headline || ""}</p>
              <p style="font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5;">${(doc.narrative_text || "").substring(0, 200)}${doc.narrative_text && doc.narrative_text.length > 200 ? "..." : ""}</p>
            </div>
          `;
        });
        
        documentsListEl.innerHTML = html;
      } catch (err) {
        documentsListEl.innerHTML = `<p style="color: var(--muted); padding: 20px; text-align: center;">Failed to load documents: ${err}</p>`;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const locationsInput = document.getElementById("locations").value;
      const limitInput = document.getElementById("limit").value;
      
      const locations = locationsInput.split(",").map(l => l.trim()).filter(l => l);
      const limit = parseInt(limitInput) || 50;
      
      if (!locations.length) {
        resultEl.textContent = "Please enter at least one location.";
        return;
      }
      
      resultEl.textContent = "Syncing weather data for " + locations.length + " location(s)...";

      try {
        const resp = await fetch("/weather/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ locations, limit }),
        });
        const data = await resp.json();
        
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        
        let message = `✅ Synced ${data.synced} weather document(s) for ${data.locations.length} location(s).`;
        if (data.errors && data.errors.length > 0) {
          message += "\n\nErrors:\n" + data.errors.join("\n");
        }
        resultEl.textContent = message;
        
        // Reload documents after 1 second
        setTimeout(loadDocuments, 1000);
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    // Load documents on page load
    loadDocuments();
  </script>
</body>
</html>
